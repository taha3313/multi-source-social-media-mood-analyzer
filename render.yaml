services:
  - type: web
    name: social-mood-analyzer-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: USE_GPU
        value: "0"
      - key: INFERENCE_THREADS
        value: "2"
      - key: CORS_ORIGINS
        value: https://social-mood-analyzer-site.onrender.com
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: social-mood-analyzer/1.0
      - key: MASTODON_ACCESS_TOKEN
        sync: false
      - key: MASTODON_BASE_URL
        value: https://mastodon.social
      - key: YOUTUBE_API_KEY
        sync: false
  - type: web
    name: social-mood-analyzer-site
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_URL
        value: https://social-mood-analyzer-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
