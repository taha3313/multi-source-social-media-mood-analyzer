services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file: ./backend/.env
    environment:
      HF_HOME: /app/.cache/huggingface
      USE_GPU: "0"
      INFERENCE_THREADS: "2"
    volumes:
      - hf-cache:/app/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  hf-cache:
